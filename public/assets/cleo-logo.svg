<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F1FF" />
      <stop offset="35%" stop-color="#93C5FD" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crown Emblem -->
  <g transform="translate(15, 25)">
    <path d="M10 55 L2 20 L22 36 L40 8 L58 36 L78 20 L70 55 Z" fill="none" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="2" cy="18" r="3.5" fill="#BAE6FD" />
    <circle cx="40" cy="6" r="4.5" fill="#E0F2FE" />
    <circle cx="78" cy="18" r="3.5" fill="#BAE6FD" />
    <circle cx="22" cy="36" r="2.5" fill="#7DD3FC" />
    <circle cx="58" cy="36" r="2.5" fill="#7DD3FC" />
    <!-- Center diamond crystal -->
    <polygon points="40,25 47,37 40,49 33,37" fill="url(#iceGrad)" opacity="0.85" />
  </g>

  <!-- Text -->
  <text x="110" y="58" font-family="Cinzel, Cormorant Garamond, serif, system-ui" font-size="34" font-weight="800" letter-spacing="4" fill="url(#silverGrad)">CLEO</text>
  <text x="235" y="58" font-family="Cinzel, Cormorant Garamond, serif, system-ui" font-size="34" font-weight="300" letter-spacing="6" fill="url(#iceGrad)" filter="url(#glow)">ICE QUEEN</text>
  <text x="112" y="82" font-family="Montserrat, sans-serif" font-size="10" font-weight="600" letter-spacing="8" fill="#94A3B8">ZAMBIAN HIP HOP ROYALTY</text>
  
  <!-- Subtle crystal sparkle -->
  <path d="M470 30 Q470 42 475 42 Q470 42 470 54 Q470 42 465 42 Q470 42 470 30 Z" fill="#E0F2FE" />
</svg>